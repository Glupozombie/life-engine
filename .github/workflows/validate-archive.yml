name: Validate project and source archive

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "project-archive/life-engine.zip"
      - ".github/workflows/validate-archive.yml"
  pull_request:
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "tests/**"
      - "package.json"
      - "project-archive/life-engine.zip"
      - ".github/workflows/validate-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tracked JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find js tests scripts -type f -name '*.js' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No tracked JavaScript source or test files found"
            exit 1
          fi
          printf 'Checking %s JavaScript source/test files\n' "${#files[@]}"
          for file in "${files[@]}"; do
            echo "Checking: $file"
            node --check "$file"
          done

      - name: Run simulation tests
        run: node --test tests/*.test.js

      - name: Verify retained ZIP integrity
        run: unzip -t project-archive/life-engine.zip

      - name: Check JavaScript syntax in retained ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/life-engine-source
          unzip -q project-archive/life-engine.zip -d /tmp/life-engine-source
          mapfile -d '' files < <(find /tmp/life-engine-source -type f -name '*.js' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No JavaScript files found in retained source archive"
            exit 1
          fi
          printf 'Checking %s archived JavaScript files\n' "${#files[@]}"
          for file in "${files[@]}"; do
            echo "Checking archive file: ${file#/tmp/life-engine-source/}"
            node --check "$file"
          done
